<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkNearby | Offline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #020617;
      color: white;
      font-family: 'Outfit', sans-serif;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      padding: 3rem;
      border-radius: 3rem;
      max-width: 400px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.05em;
      margin-bottom: 1rem;
      font-size: 2.5rem;
    }
    p {
      color: #94a3b8;
      font-weight: 500;
      line-height: 1.6;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: rgba(147, 51, 234, 0.1);
      border: 1px solid rgba(147, 51, 234, 0.2);
      border-radius: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
    }
    button {
      background-color: #9333ea;
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 1.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.75rem;
      margin-top: 2rem;
      cursor: pointer;
      box-shadow: 0 10px 15px -3px rgba(147, 51, 234, 0.4);
    }
  </svg>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#9333ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
    </div>
    <h1>You're Offline</h1>
    <p>WorkNearby requires an internet connection to find local gigs and chat with clients. Please check your signal.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
